<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_name }} — Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container { padding: 2rem; }
        .icon { font-size: 4rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .back {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: #1e293b;
            color: #38bdf8;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: all 0.2s;
            font-weight: 500;
        }
        .back:hover { background: #334155; transform: translateY(-2px); }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>{{ page_name }}</h1>
        <p>This feature is under development and will be available in a future release.</p>
        <a href="{{ url_for('dashboard.dashboard') }}" class="back">← Back to Dashboard</a>
    </div>
</body>
</html>
